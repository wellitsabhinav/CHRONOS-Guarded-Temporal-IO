project:
  title: "CHRONOS M0 temporal event engine"
  author: "Abhinav (wellitsabhinav) and CHRONOS contributors"
  discord: ""
  description: "Ordered future GPIO events with cycle-exact dispatch and visible faults"
  language: "Verilog"
  clock_hz: 50000000
  tiles: "6x4"
  top_module: "tt_um_chronos"
  source_files:
    - "project.v"
    - "chronos_engine.v"
    - "chronos_loader.v"
pinout:
  ui[0]: "host nibble bit 0"
  ui[1]: "host nibble bit 1"
  ui[2]: "host nibble bit 2"
  ui[3]: "host nibble bit 3"
  ui[4]: "host command bit 0"
  ui[5]: "host command bit 1"
  ui[6]: "host command bit 2"
  ui[7]: "readback mode"
  uo[0]: "scheduled output / readback bit 0"
  uo[1]: "scheduled output / readback bit 1"
  uo[2]: "scheduled output / readback bit 2"
  uo[3]: "scheduled output / readback bit 3"
  uo[4]: "scheduled output / readback bit 4"
  uo[5]: "scheduled output / readback bit 5"
  uo[6]: "scheduled output / readback bit 6"
  uo[7]: "scheduled output / readback bit 7"
  uio[0]: "scheduled bidirectional GPIO 0"
  uio[1]: "scheduled bidirectional GPIO 1"
  uio[2]: "scheduled bidirectional GPIO 2"
  uio[3]: "scheduled bidirectional GPIO 3"
  uio[4]: "scheduled bidirectional GPIO 4"
  uio[5]: "scheduled bidirectional GPIO 5"
  uio[6]: "scheduled bidirectional GPIO 6"
  uio[7]: "scheduled bidirectional GPIO 7"
yaml_version: 6
