name: M0 verification
on: [push, pull_request, workflow_dispatch]
jobs:
  qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys
          pip install -r test/requirements.txt
      - name: Model, RTL, differential and lint
        run: make test
      - name: Bounded formal properties
        run: make formal
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: M0-verification
          path: |
            build/**/results.xml
            build/**/differential_summary.json
            build/formal/summary.json
