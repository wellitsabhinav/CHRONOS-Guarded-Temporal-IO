name: gds

on:
  push:
    branches-ignore: [development/m2-programmable-core, development/m3-ordinary-spi-peer-timing, 'research/m3-*']
    # Research evidence and workflow maintenance do not launch physical work.
    # Automatic qualification applies only to the historical M0 production top.
    paths:
      - 'src/project.v'
      - 'src/chronos_engine.v'
      - 'src/chronos_loader.v'
      - 'src/config.json'
      - 'info.yaml'
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    # Pages deployment is restricted to main after an M0 physical-input change.
    if: github.ref == 'refs/heads/main'
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
